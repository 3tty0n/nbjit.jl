# ReBench configuration for nbjit.jl

default_experiment: all
default_data_file: 'benchmark.data'

runs:
  env:
    PATH: "/usr/bin:/usr/local/bin:/home/yusuke/.juliaup/bin:/opt/homebrew/bin:$PATH"

benchmark_suites:
  notebook-simulation:
    gauge_adapter: RebenchLog
    command: "--project=. benchmark/benchmark_notebook_simulation.jl --rebench --executor=%(executor)s %(benchmark)s"
    benchmarks:
      - ParameterSweep
      - StructureEvolution
      - MixedWorkflow
      - NestedLoops
      - GridSearch
      - MonteCarlo
      - PhysicsSim
      - ImageFilter

  realistic-simulation:
    gauge_adapter: RebenchLog
    command: "--project=. benchmark/benchmark_realistic_simulation.jl --rebench --executor=%(executor)s --benchmark=%(benchmark)s --iteration=%(iterations)s"
    iterations: 10
    benchmarks:
      - SimplifiedDataWorkflow
      - SimplifiedDebugging
      - HyperparameterSweep
      - VisualizationTweaks
      - AlgorithmRefinement

  visualization:
    gauge_adapter: RebenchLog
    command: "--project=. benchmark/visualize_simulation.jl %(benchmark)s"
    max_invocation_time: 600
    benchmarks:
      - notebook
      - realistic
      - resources

executors:
  julia:
    executable: julia
    args: ""
  nbjit:
    executable: julia
    args: ""
  visualizer:
    executable: julia
    args: ""

experiments:
  all:
    description: "Run a simulation benchmark"
    suites:
      - realistic-simulation
    executions:
      - nbjit
      - julia
    invocations: 1

  visualize:
    description: "Generate publication-quality plots from benchmark results"
    suites:
      - visualization
    executions:
      - visualizer
    invocations: 1
